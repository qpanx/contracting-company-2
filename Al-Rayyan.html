<!DOCTYPE html>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            font-family: 'Tajawal', sans-serif;

        }
        .active-filter {
            background-color: #8A7F7C !important;

        }
        
        /* Make project title bold */
        #projectTitle {
            font-weight: bold !important;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #projectLocation {
            font-weight: 600;
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="bg-gray-50">
 <section class="sub-header">
        <a href="index.html" class="logo-link"><img src="imgs/icon-white--preview.png" style="width: 180px;"></a>
        <nav>
            <div class="nav-links" id="navLinks">
                <i class="fa fa-times" onclick="hideMenu()"></i>
                <ul>
                    <li><a href="index.html" id="nav-home">Home</a></li>
                    <li><a href="index.html" id="nav-about">About</a></li>
                    <li><a href="projects.html" id="nav-projects">Projects</a></li>
                    <li><a href="contact.html" id="nav-contact">Contact</a></li>
                </ul>
            </div>
            <!-- Desktop language switcher -->
            <div class="language-switcher">
                <button class="lang-btn" id="langToggleBtn">عربي</button>
            </div>
            <!-- Mobile nav controls container -->
            <div class="nav-controls">
                <button class="lang-btn" id="langToggleBtn2">عربي</button>
                <i class="fa fa-bars hamburger-menu" onclick="showMenu()"></i>
            </div>
        </nav>
        <video autoplay muted loop playsinline>
        <source src="imgs/WhatsApp Video 2025-10-14 at 11.00.39_5621156e.mp4" type="video/mp4">
        
        </video>
        <h1 id="projectTitle">مشروع الريان</h1>
        <h2 id="projectLocation">جدة/حي الريان</h2>


    </section>

    <div class="container mx-auto p-4 md:p-8">
        
        <!-- Header Section -->
       <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
    <div class="flex items-center space-x-4 space-x-reverse">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">جدول الوحدات</h1>
        <div class="w-16 h-1 bg-amber-800/50 rounded-full"></div>
    </div>
    <div class="flex flex-wrap justify-center gap-2" id="filter-buttons">
        <button data-filter="all" class="filter-btn active-filter text-sm md:text-base font-medium px-4 py-2 rounded-lg bg-gray-200 text-gray-700 transition-colors duration-300">الجميع</button>
        <button data-filter="available" class="filter-btn text-sm md:text-base font-medium px-4 py-2 rounded-lg bg-gray-200 text-gray-700 transition-colors duration-300">متاح</button>
        <button data-filter="sold" class="filter-btn text-sm md:text-base font-medium px-4 py-2 rounded-lg bg-gray-200 text-gray-700 transition-colors duration-300">مباع</button>
        <button data-filter="reserved" class="filter-btn text-sm md:text-base font-medium px-4 py-2 rounded-lg bg-gray-200 text-gray-700 transition-colors duration-300">محجوز</button>
    </div>
</header>

        <!-- Property Cards Grid -->
        <main id="property-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Property cards will be injected here by JavaScript -->
        </main>

    </div>

    <script>
const propertyData = [

  {
    id: 'أمامية',
    titleEn: 'Front',
    titleAr: 'أمامية',
    status: 'available',
    price: '1,263,000',
    floor: 'الأرضي',
    floorEn: 'Ground',
    floorAr: 'الأرضي',
    area: 95,
    bedrooms: 2,
    bathrooms: 2,
    images: [
      'imgs/App-AlRay/أمامية/ALRYAAN - TOP VIEW -.jpeg',
      'imgs/App-AlRay/أمامية/ALRYAAN - TOP VIEW --.jpeg',
      'imgs/App-AlRay/أمامية/ALRYAAN - TOP VIEW.jpeg',
      'imgs/App-AlRay/أمامية/BATHROOM - L -.jpeg',
      'imgs/App-AlRay/أمامية/BEDROOM - ALRYAAN -.jpeg',
      'imgs/App-AlRay/أمامية/BEDROOM - ALRYAAN.jpeg',
      'imgs/App-AlRay/أمامية/KITCHEN.jpeg',
      'imgs/App-AlRay/أمامية/LIVING ROOM.jpeg',
      'imgs/App-AlRay/أمامية/LIVINGROOM - ALYAAN.jpeg',
      'imgs/App-AlRay/أمامية/M ROOM - ALRYAAN.jpeg',
      'imgs/App-AlRay/أمامية/SALON - ALRYAAN -.jpeg',
      'imgs/App-AlRay/أمامية/SALON MEN.jpeg' // add a second image
    ],
    currentImageIndex: 0,
    description: 'وحدة سكنية مثالية للعائلات الصغيرة، تتميز بالهدوء والقرب من الخدمات.'
  },

  {
    id: 'خلفية',
    titleEn: 'Rear',
    titleAr: 'خلفية',
    status: 'available',
    price: '1,288,000',
    floor: 'الأرضي',
    floorEn: 'Ground',
    floorAr: 'الأرضي',
    area: 117.12,
    bedrooms: 2,
    bathrooms: 2,
    images: [
      'imgs/App-AlRay/خلفية/TOP VIEW - ALRYAAN -.jpeg',
      'imgs/App-AlRay/خلفية/TOP VIEW - ALRYAAN --.jpeg',
      'imgs/App-AlRay/خلفية/TOP VIEW - ALRYAAN.jpeg',
      'imgs/App-AlRay/خلفية/BATHROOM - S.jpeg',
      'imgs/App-AlRay/خلفية/BEDROOOM - ALRYAAN.jpeg',
      'imgs/App-AlRay/خلفية/KITCHEN.jpeg',
      'imgs/App-AlRay/خلفية/LIVINGROOM - ALRYAAN -.jpeg',
      'imgs/App-AlRay/خلفية/M ROOM -.jpeg',
      'imgs/App-AlRay/خلفية/M ROOM --.jpeg',
      'imgs/App-AlRay/خلفية/SALOON - ALRYAAN --.jpeg' // add a second image
    ],
    currentImageIndex: 0,
    description: 'استمتع بالراحة والفخامة في هذه الشقة ذات التصميم الفريد والمساحات المفتوحة.'
  },
  {
    id: 'طابق الملاحق',
    titleEn: 'Annex Floor',
    titleAr: 'طابق الملاحق',
    status: 'available',
    price: '750,000',
    floor: 'علوي',
    floorEn: 'Upper',
    floorAr: 'علوي',
    area: 127,
    bedrooms: 2,
    bathrooms: 3,
    images: [
      'imgs/App-AlRay/ملحق/ALRYAAN - TOPVIEW1 -.jpeg',
      'imgs/App-AlRay/ملحق/ALRYAAN - TOPVIEW2.jpeg',
      'imgs/App-AlRay/ملحق/ALRYAAN - TOPVIEW3 ---.jpeg',
      'imgs/App-AlRay/ملحق/BATHROOM - 1 -.jpeg',
      'imgs/App-AlRay/ملحق/BEDROOM.jpeg',
      'imgs/App-AlRay/ملحق/KITCHEN.jpeg',
      'imgs/App-AlRay/ملحق/LIVINGROOM -.jpeg',
      'imgs/App-AlRay/ملحق/M ROOM -.jpeg',
      'imgs/App-AlRay/ملحق/ROOOF -.jpeg', // add a second image
    ],
    currentImageIndex: 0,
    description: 'شقة واسعة بإطلالة مميزة على الحديقة. تصميم عصري وتشطيبات عالية الجودة.'
  },
];

        const statusStyles = {
            available: { text: 'متاحة', color: 'text-green-600', bg: 'bg-green-100' },
            sold: { text: 'مباعة', color: 'text-red-600', bg: 'bg-red-100' },
            reserved: { text: 'محجوزة', color: 'text-yellow-600', bg: 'bg-yellow-100' }
        };

        const translations = {
            ar: {
                home: "الرئيسية", 
                about: "من نحن", 
                projects: "المشاريع", 
                contact: "تواصل معنا",
                pageTitle: " مشروع الريان", 
                projectLocation: "جدة/حي الريان",
                unitsTable: "جدول الوحدات",
                all: "الجميع", 
                available: "متاح", 
                sold: "مباع", 
                reserved: "محجوز",
                booking: "الحجز", 
                location: "لوكيشن", 
                floor: "الدور",
                availableStatus: "متاحة", 
                soldStatus: "مباعة", 
                reservedStatus: "محجوزة"
            },
            en: {
                home: "Home", 
                about: "About", 
                projects: "Projects", 
                contact: "Contact",
                pageTitle: "Al-Rayyan Project", 
                projectLocation: "Jeddah/Al-Rayyan District",
                unitsTable: "Units Table",
                all: "All", 
                available: "Available", 
                sold: "Sold", 
                reserved: "Reserved",
                booking: "Booking", 
                location: "Location", 
                floor: "Floor",
                availableStatus: "Available", 
                soldStatus: "Sold", 
                reservedStatus: "Reserved"
            }
        };

        const propertyGrid = document.getElementById('property-grid');
        const filterButtonsContainer = document.getElementById('filter-buttons');
        const langToggleBtn = document.getElementById('langToggleBtn');
        const langToggleBtn2 = document.getElementById('langToggleBtn2');

        // Use a single currentLang variable to avoid mismatch
        let currentLang = document.documentElement.lang || 'ar';

        // Function to create and render property cards
        function renderCards(filter = 'all') {
            propertyGrid.innerHTML = ''; // Clear existing cards

            // attach original index to each item so IDs stay stable after filtering
            const mapped = propertyData.map((p, i) => ({ ...p, __idx: i }));
            const filteredData = mapped.filter(prop => filter === 'all' || prop.status === filter);
            const t = translations && translations[currentLang] ? translations[currentLang] : translations['ar'];

            filteredData.forEach((prop) => {
                const style = statusStyles[prop.status];
                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden flex flex-col transition-all duration-300 transform hover:scale-105';
                card.dataset.status = prop.status;
                card.dataset.index = prop.__idx; // original index

                const title = (currentLang === 'ar') ? (prop.titleAr || prop.id) : (prop.titleEn || prop.id);
                const floorText = (currentLang === 'ar') ? (prop.floorAr || prop.floor) : (prop.floorEn || prop.floor);
                const floorLabel = `${t.floor || (currentLang === 'ar' ? 'الدور' : 'Floor')}: ${floorText}`;
                const bookingText = t.booking || (currentLang === 'ar' ? 'الحجز' : 'Booking');
                const locationText = t.location || (currentLang === 'ar' ? 'لوكيشن' : 'Location');
                const statusText = (prop.status === 'available') ? t.availableStatus : (prop.status === 'sold' ? t.soldStatus : t.reservedStatus);

                card.innerHTML = `
                    <div class="p-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xl font-bold text-gray-800">${title}</span>
                            <span class="text-sm font-medium px-3 py-1 rounded-full ${style.bg} ${style.color}">${statusText}</span>
                        </div>
                    </div>
                    <div class="px-4 pb-4 relative">
                        <img src="${prop.images[prop.currentImageIndex]}" alt="صورة المشروع ${prop.id}" class="w-full h-80 md:h-96 lg:h-[28rem] object-cover rounded-md shadow-inner" id="img-${prop.__idx}">
                        <button data-project-index="${prop.__idx}" class="change-photo-btn absolute top-2 right-2 bg-white/70 backdrop-blur-sm hover:bg-white rounded-full p-1.5 transition-colors duration-200" title="تغيير الصورة">
                            <svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0011.667 0l3.181-3.183m-4.991-2.691V5.006h-4.992v4.992h4.992z" />
                            </svg>
                        </button>
                    </div>
                    <div class="px-4 pb-4 text-gray-600 text-sm">
                        <p>${prop.description}</p>
                    </div>
                    <div class="p-4 bg-gray-50 border-t border-gray-200">
                        <div class="grid grid-cols-4 gap-2 text-center text-gray-600">
                            <div class="flex flex-col items-center">
                                <svg class="w-6 h-6 mb-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                                <span class="text-xs font-medium">${floorLabel}</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <svg class="w-6 h-6 mb-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5v-4m0 0h-4m4 0l-5-5"></path></svg>
                                <span class="text-xs font-medium">${prop.area} م²</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <svg class="w-6 h-6 mb-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 14v3m4-3v3m4-3v3M3 21h18M3 10h18M3 7l9-4 9 4M4 10h16v11H4V10z"></path></svg>
                                <span class="text-xs font-medium">${prop.bedrooms}</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <svg class="w-6 h-6 mb-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                                <span class="text-xs font-medium">${prop.bathrooms}</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-auto p-4 grid grid-cols-2 gap-2">
                        <button data-action="booking" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300">
                            ${bookingText}
                        </button>
                        <button data-action="location" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300">
                            ${locationText}
                        </button>
                    </div>
                `;
                propertyGrid.appendChild(card);
            });
        }

        // filters
        filterButtonsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('filter-btn')) {
                document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active-filter'));
                e.target.classList.add('active-filter');
                const filterValue = e.target.dataset.filter;
                renderCards(filterValue);
            }
        });

        // Event listener for changing photos and button clicks
        propertyGrid.addEventListener('click', (e) => {
          const changeBtn = e.target.closest('.change-photo-btn');
          if (changeBtn) {
            const projectIndex = parseInt(changeBtn.dataset.projectIndex, 10);
            const project = propertyData[projectIndex];
            if (!project || !project.images || project.images.length < 2) {
              console.warn('Add at least 2 images to switch photos for this card', project);
              return;
            }
            project.currentImageIndex = (project.currentImageIndex + 1) % project.images.length;
            const newImageSrc = project.images[project.currentImageIndex];
            const imgElement = document.getElementById(`img-${projectIndex}`);
            if (imgElement) {
              imgElement.classList.add('opacity-0');
              imgElement.onload = () => imgElement.classList.remove('opacity-0');
              imgElement.src = newImageSrc;
            }
            return;
          }

          const btn = e.target.closest('button[data-action]');
          if (!btn) return;

          if (btn.dataset.action === 'location') {
            const latitude = 21.6042;
            const longitude = 39.1542;
            const mapUrl = `https://www.google.com/maps?q=${latitude},${longitude}`;
            window.open(mapUrl, '_blank');
          } else if (btn.dataset.action === 'booking') {
            alert(currentLang === 'ar' ? 'سيتم توجيهك إلى صفحة الحجز قريباً' : 'You will be redirected to the booking page soon');
          }
        });

        // initial render
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();
        });

        // set language and update UI
        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang] || translations['ar'];

            // nav (guard for missing ids)
            const navHome = document.getElementById('nav-home');
            if (navHome) navHome.textContent = t.home;
            const navAbout = document.getElementById('nav-about');
            if (navAbout) navAbout.textContent = t.about;
            const navProjects = document.getElementById('nav-projects');
            if (navProjects) navProjects.textContent = t.projects;
            const navContact = document.getElementById('nav-contact');
            if (navContact) navContact.textContent = t.contact;

            // page headings
            const projectTitle = document.getElementById('projectTitle');
            if (projectTitle) projectTitle.textContent = t.pageTitle;
            const projectLocation = document.getElementById('projectLocation');
            if (projectLocation) projectLocation.textContent = t.projectLocation;
            const headerH1 = document.querySelector('header h1');
            if (headerH1) headerH1.textContent = t.unitsTable;

            // filter buttons
            const allBtn = document.querySelector('[data-filter="all"]');
            const avBtn = document.querySelector('[data-filter="available"]');
            const soldBtn = document.querySelector('[data-filter="sold"]');
            const resBtn = document.querySelector('[data-filter="reserved"]');
            if (allBtn) allBtn.textContent = t.all;
            if (avBtn) avBtn.textContent = t.available;
            if (soldBtn) soldBtn.textContent = t.sold;
            if (resBtn) resBtn.textContent = t.reserved;

            // update status styles text
            statusStyles.available.text = t.availableStatus;
            statusStyles.sold.text = t.soldStatus;
            statusStyles.reserved.text = t.reservedStatus;

            // update page direction / lang attribute
            if (lang === 'ar') {
                document.body.style.direction = 'rtl';
                document.documentElement.lang = 'ar';
                if (langToggleBtn) langToggleBtn.textContent = 'EN';
                if (langToggleBtn2) langToggleBtn2.textContent = 'EN';
            } else {
                document.body.style.direction = 'ltr';
                document.documentElement.lang = 'en';
                if (langToggleBtn) langToggleBtn.textContent = 'عربي';
                if (langToggleBtn2) langToggleBtn2.textContent = 'عربي';
            }

            // re-render cards preserving active filter
            const activeFilterBtn = document.querySelector('.filter-btn.active-filter') || document.querySelector('[data-filter="all"]');
            const activeFilter = activeFilterBtn ? activeFilterBtn.dataset.filter : 'all';
            renderCards(activeFilter);

            localStorage.setItem('selectedLanguage', lang);
        }

        // toggle handlers
        if (langToggleBtn) langToggleBtn.addEventListener('click', () => setLanguage(currentLang === 'ar' ? 'en' : 'ar'));
        if (langToggleBtn2) langToggleBtn2.addEventListener('click', () => setLanguage(currentLang === 'ar' ? 'en' : 'ar'));

        // load saved language
        window.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('selectedLanguage') || 'ar';
            setLanguage(savedLang);
        });

        // mobile menu functions
        var navLinks = document.getElementById("navLinks");
        function showMenu() { if (navLinks) navLinks.classList.add('open'); }
        function hideMenu() { if (navLinks) navLinks.classList.remove('open'); }
    </script>
</body>
</html>
